<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 224" shape-rendering="crispEdges">
  <style>
    #cyclops-iris {
      transform-box: fill-box;
      transform-origin: center;
      animation: cyclops-pulse 2.8s ease-in-out infinite alternate;
    }

    #cyclops-pupil {
      animation: cyclops-scan 3.6s ease-in-out infinite alternate;
    }

    @keyframes cyclops-pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    @keyframes cyclops-scan {
      0% { transform: translateX(0px); }
      45% { transform: translateX(4px); }
      100% { transform: translateX(-4px); }
    }
  </style>

  <g fill="#1a1218" opacity="0.22">
    <rect x="64" y="192" width="128" height="8"/>
    <rect x="80" y="200" width="96" height="8"/>
  </g>

